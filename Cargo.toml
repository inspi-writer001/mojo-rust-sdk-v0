[package]
name = "mojo-rust-sdk"
version = "0.1.0"
edition = "2021"
description = "A high-performance Solana gaming SDK designed to totally abstract the complexities of managing state in onchain games/applications powered by Magicblock, Metaplex, Pinocchio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inspi-writer001/mojo-rust-sdk-v0"
readme = "README.md"
keywords = ["solana", "gaming", "metaplex", "magicblock", "leptos", "pinocchio"]
categories = [
    "blockchain-utilities",
    "game-development",
    "wasm",
    "cryptography",
]

[features]
default = ["native", "arweave", "image-upload"]
native = [
    "dep:solana-client",
    "dep:solana-sdk",
    "dep:solana-rpc-client",
    "dep:solana-account",
    "dep:solana-transaction",
    "dep:solana-message",
]
arweave = [
    "native",
    "image-upload",
    "dep:arweave-rs",
    "dep:tempfile",
    "dep:dirs",
]
image-upload = ["dep:image", "tokio/fs"]

[dependencies]
# Always available (WASM-safe)
solana-pubkey = "2.2.1"
solana-keypair = "2.2.1"
solana-signer = "2.2.1"
solana-instruction = "2.2.1"
solana-transaction = { version = "2.2.1", optional = true }
solana-message = { version = "2.2.1", optional = true }
solana-sdk-ids = "2.2.1"
solana-system-interface = "1.0.0"
solana-program = "2.2.1"
solana-native-token = "2.2.1"
solana-address = "1.0.0"
mpl-core = "0.11.1"
anyhow = "1.0"
sha2 = "0.10.9"
bytemuck = { version = "1.15", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
url = "2.5"
image = { version = "0.24", optional = true }
tokio = { version = "1", features = ["rt", "macros"] }

# Native-only (optional)
solana-sdk = { version = "2.2.1", optional = true }
solana-client = { version = "2.2.1", optional = true }
solana-rpc-client = { version = "2.2.1", optional = true }
solana-account = { version = "2.2.1", optional = true }

# Arweave upload (optional, implies native)
arweave-rs = { version = "0.2.0", optional = true }
tempfile = { version = "3.8", optional = true }
dirs = { version = "5.0", optional = true }
